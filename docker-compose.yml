services:
  postgres:
    image: postgres:17-alpine
    container_name: evidencegraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evidencegraph
      POSTGRES_USER: evidencegraph_app
      POSTGRES_PASSWORD: evidencegraph_dev_secret_pw!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencegraph_app -d evidencegraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26.0
    container_name: evidencegraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev_password_2026!
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j_dev_password_2026!", "RETURN 1;"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-07T00-59-55Z
    container_name: evidencegraph-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_pw!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T17-10-18Z
    container_name: evidencegraph-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin_dev_pw!;
      /usr/bin/mc mb --ignore-existing myminio/evidence-original;
      /usr/bin/mc mb --ignore-existing myminio/evidence-derived;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: evidencegraph-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      DATABASE_URL: Host=postgres;Port=5432;Database=evidencegraph;Username=evidencegraph_app;Password=evidencegraph_dev_secret_pw!
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_pw!
      MINIO_ORIGINAL_BUCKET: evidence-original
      MINIO_DERIVED_BUCKET: evidence-derived
      JWT_SIGNING_KEY: EvidenceGraph_SuperSecure_JwtSecretKey_DevelopmentOnly_2026!_Min32Chars
      JWT_ISSUER: EvidenceGraph.Api
      JWT_AUDIENCE: EvidenceGraph.Web
      JWT_EXPIRY_MINUTES: 120
      ANALYSIS_SERVICE_URL: http://analysis-service:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  analysis-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.analysis
    container_name: evidencegraph-analysis
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_dev_password_2026!
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      OLLAMA_BASE_URL: http://localhost:11434
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: evidencegraph-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
      - analysis-service

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
